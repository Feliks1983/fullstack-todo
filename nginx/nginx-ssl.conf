events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    upstream frontend { server frontend:80;   keepalive 16; }
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    map $request_method $upload_key {
        default "";
        POST    $binary_remote_addr;
        PUT     $binary_remote_addr;
    }
    limit_req_zone $upload_key zone=uploads:10m rate=2r/s;

    proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads_cache:10m
                     max_size=500m inactive=7d use_temp_path=off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;
        set $backend_host backend:3000;

        location = /health {
            access_log off;
            proxy_pass http://$backend_host/health;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        set $backend_host backend:3000;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        location = /health {
            access_log off;
            proxy_pass http://$backend_host/health;
        }

        location ~ "^/api/todos(/[a-f0-9]{24})?$" {
            limit_req zone=api burst=20 nodelay;
            limit_req zone=uploads burst=5 nodelay;
            client_max_body_size 10M;
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
            proxy_pass http://$backend_host;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_pass http://$backend_host;
        }

        location /uploads/ {
            proxy_pass http://$backend_host;
            proxy_cache uploads_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating;
            expires 7d;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
